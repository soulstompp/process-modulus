# This setting is what makes `Cargo.toml`'s promise true: "the `.sqlx` cache is
# committed, so building needs no database". Without it, `sqlx`'s `query_file!` macros
# prefer a `DATABASE_URL` found in the environment over the cache, so anyone with one
# set for an unrelated project fails to build the examples against tables that exist
# only in `assets/ddl/schema.ddl`.
#
# Not `force = true`. `cargo sqlx prepare` regenerates the cache by running cargo with
# `SQLX_OFFLINE=false` in the environment it spawns. Cargo's `[env]` yields to a variable
# already set, so the plain form applies everywhere it should and steps aside for the one
# command that must reach a real database. Forcing it would leave the cache impossible to
# regenerate.
[env]
SQLX_OFFLINE = "true"
